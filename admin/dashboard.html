<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Paula Docce Admin</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <header class="admin-header">

        <h1>Paula Docce Admin</h1>

<a href="#" id="logoutBtn" class="logout-btn">
    Odhlásit
</a>

    </header>

    <section class="welcome">

        <h2>Dobrý den, Paulo 👋</h2>

        <p>
            Vítejte v administraci webu. Odtud můžete spravovat obsah webových stránek.
        </p>

    </section>

    <section class="dashboard-grid">

        <a href="pricing.html" class="dashboard-card">

            <span class="icon">💰</span>

            <h3>Ceník</h3>

            <p>
                Upravit služby, ceny a pořadí položek.
            </p>

        </a>

    </section>

    <section class="status-card">

        <h3>🌐 Stav webu</h3>

        <div class="status-row">
            <span>Web</span>
            <strong class="online">GitHub Pages</strong>
        </div>

        <div class="status-row">
            <span>Úložiště</span>
            <strong class="online">GitHub JSON</strong>
        </div>

        <div class="status-row">
            <span>Poslední uložení</span>
            <strong>Po uložení do GitHubu</strong>
        </div>

    </section>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
